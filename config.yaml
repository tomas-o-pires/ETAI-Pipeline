# Baseline pipeline configuration.
# Nothing here is hardcoded in the source files below -- everything tunable lives in this one place.

data:
  path: "data/compas_two_year_recidivism.csv"
  target: "two_year_recid"
  sensitive_attr: "race"          # excluded from model features, used only to audit fairness
  drop_columns: ["id", "decile_score", "score_text"]  # identifiers / COMPAS's own score, not our model's inputs


# Added on Week 4: the FINAL TEST SET. Carved out once, stratified, and locked: never used to fit,
# tune, compare or choose anything. Used only for the final assessment.
test_set:
  size: 0.2
  random_state: 42

# Added on Week 4: how models are evaluated -- stratified k-fold cross-validation on the
# development set (everything except the locked test set). Same random_state = same folds on
# every run, for every model, so comparisons are like-for-like.
cv:
  n_splits: 5
  shuffle: true
  random_state: 42
  scoring: "accuracy"   # one metric for now, so numbers compare directly with weeks 2-3
  n_jobs: 1             

# Added on week3 to help in the preprocessing step. 
# allows for src/preprocessing.py need to stay generic instead of hardcoding COMPAS's column names.
#in case of a different dataset, we can just change the values here instead of changing the code in preprocessing.py
diagnostics:
  id_column: "id"
  candidate_predictors: ["sex", "race", "age_cat", "c_charge_degree", "score_text"]
  numeric_text_columns: ["priors_count", "prior_offenses"] # columns that load as text purely because a placeholder token shows up somewhere in them
  placeholder_tokens: ["-", "?", "n/a", "N/A", "na", "NA", ""]
  validity_rules: #useful for sanity-checking the data
    age: {min: 18, max: 100}
    decile_score: {min: 1, max: 10}
    juv_fel_count: {min: 0}
    priors_count: {min: 0, max: 60}
  canonical_categories: # useful for category hygiene
    sex:
      male: "Male"
      female: "Female"
    race: 
      african-american: "African-American"
      african american: "African-American"
      caucasian: "Caucasian"
      hispanic: "Hispanic"
      other: "Other"
      asian: "Asian"
      native american: "Native American"
    c_charge_degree:
      f: "F"
      felony: "F"
      m: "M"
      misdemeanor: "M"
    score_text:
      low: "Low"
      medium: "Medium"
      high: "High"
  redundant_columns: ["prior_offenses", "age_in_months", "juvenile_total"] # multicollinearity casualties

# Added on week 4
preprocessing:
  encoder: "target"                                 # onehot | ordinal | count | target
  scaler: "robust"                                  # none | standard | minmax | robust
  numeric_features: ["age", "juv_fel_count", "juv_misd_count", "juv_other_count", "priors_count"]
  categorical_features: ["sex", "age_cat", "c_charge_degree"]
  mnar_indicator_sources: ["priors_count", "c_charge_degree"]   # get a <col>_was_missing flag
  random_state: 42                                  # target encoder's internal folds
  imputation:
    numeric_strategy: "median"
    categorical_strategy: "most_frequent"


#Updated on week 6: the model itself, and its hyperparameters. 
model:
  type: "adaboost"     # dummy | logistic_regression | decision_tree | random_forest | oblique_random_forest | adaboost
  params:
    max_depth: 1
    n_estimators: 200       # more trees never overfit, they only cost time
    random_state: 42
    #n_jobs: -1              # -1 = all CPU cores
    #max_iter: 2000
    #n_components: 10         # <= number of features, for oblique trees only
    learning_rate: 1.0
  # Other models' params, to swap in:
  # decision_tree:          {random_state: 42}
  # logistic_regression:    {max_iter: 2000}
  # oblique_random_forest:  {n_estimators: 200, n_components: 10, random_state: 42, n_jobs: -1}
  # adaboost:               {max_depth: 1, n_estimators: 200, learning_rate: 1.0, random_state: 42}

#added on week 6: hyperparameter tuning. 
tuning:
  enabled: true
  n_trials: 30
  n_splits: 5                                       # folds that score each candidate
  random_state: 42                                  # seeds the sampler and those folds
  # Keys are Pipeline parameter names. Types: int / float (low, high, log) or categorical (choices).
  # Ensembles take minutes per run: use a small n_trials while testing.
  search_spaces:
    logistic_regression:
      model__C: {type: float, low: 0.001, high: 100.0, log: true}
      model__solver: {type: categorical, choices: ["lbfgs", "liblinear"]}
      model__max_iter: {type: int, low: 500, high: 2000}
    decision_tree:
      model__max_depth: {type: int, low: 1, high: 20}
      model__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__criterion: {type: categorical, choices: ["gini", "entropy"]}
    random_forest:
      model__max_depth: {type: int, low: 2, high: 30}
      model__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__max_features: {type: categorical, choices: ["sqrt", 0.5, 1.0]}
    oblique_random_forest:
      model__estimator__tree__max_depth: {type: int, low: 2, high: 30}
      model__estimator__tree__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__estimator__project__n_components: {type: int, low: 3, high: 10}   # <= number of features
    adaboost:
      model__estimator__max_depth: {type: int, low: 1, high: 8}
      model__n_estimators: {type: int, low: 25, high: 400, log: true}
      model__learning_rate: {type: float, low: 0.01, high: 1.0, log: true}


output:
  results_dir: "results"   # each run's full report is saved here as a timestamped .txt file
